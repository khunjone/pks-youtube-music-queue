<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YouTube Music Queue Manager</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header><h1>♫ Music Room</h1><span id="connection">กำลังเชื่อมต่อ…</span><a href="./library.html" style="color:#fff;text-decoration:none;border:1px solid #a9bfd8;border-radius:8px;padding:7px 10px;font-size:13px">คลังเพลง</a></header>
  <main>
    <section id="session-panel" class="panel">
      <h2>เริ่มใช้งาน</h2>
      <label>ชื่อผู้ส่งเพลง <input id="display-name" maxlength="80" placeholder="กรอกชื่อของคุณ"></label>
      <button id="start-session">เข้าสู่ห้องเพลง</button>
    </section>
    <section id="app-panel" hidden>
      <section class="panel">
        <h2>ค้นหาเพลงจาก YouTube</h2>
        <form id="search-form"><input id="query" placeholder="ชื่อเพลงหรือศิลปิน" minlength="2" required><button>ค้นหา</button></form>
        <label>ฝากเพลงถึง (ไม่บังคับ)<input id="recipient" maxlength="50" placeholder="ชื่อผู้รับ"></label>
        <label>ข้อความฝากเพลง (ไม่บังคับ)<input id="message" maxlength="200" placeholder="พิมพ์ข้อความถึงผู้รับ"></label>
        <div id="search-results"></div>
      </section>
      <section class="panel">
        <h2>คิวเพลง <small>เรียงตามคะแนนโหวตสูงสุด</small></h2>
        <div id="queue"></div>
      </section>
    </section>
    <p id="notice" role="status"></p>
  </main>
  <script type="module" src="assets/app.js"></script>
</body>
</html>
